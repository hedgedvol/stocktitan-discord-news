name: StockTitan news to Discord
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python stocktitan_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_SECONDS: "30"
          RUN_MINUTES: "340"
          # Filters (comma lists, empty = allow all). Example: TICKERS: "AAPL,TSLA"
          # KEYWORDS: headline must contain one; EXCLUDE: skip if headline contains one.
          TICKERS: ""
          KEYWORDS: ""
          EXCLUDE: ""
          # Optional SEC EDGAR filings, e.g. "8-K,4". Off by default (very noisy).
          SEC_FORMS: ""
          # Optional per-type channels: create repo secrets with these names; unset = DISCORD_WEBHOOK_URL.
          WEBHOOK_EARNINGS: ${{ secrets.WEBHOOK_EARNINGS }}
          WEBHOOK_FDA: ${{ secrets.WEBHOOK_FDA }}
          WEBHOOK_OFFERINGS: ${{ secrets.WEBHOOK_OFFERINGS }}
          WEBHOOK_MA: ${{ secrets.WEBHOOK_MA }}
          WEBHOOK_ANALYST: ${{ secrets.WEBHOOK_ANALYST }}
          WEBHOOK_SEC: ${{ secrets.WEBHOOK_SEC }}        # SEC filings + insider buys
          WEBHOOK_HALTS: ${{ secrets.WEBHOOK_HALTS }}
          WEBHOOK_RECAP: ${{ secrets.WEBHOOK_RECAP }}
          # Price field from Yahoo (unofficial, free). Big movers (|%| >= MOVER_PCT) get 🔥;
          # set MOVER_ROLE_ID (Discord role id) to ping that role.
          PRICES: "1"
          MOVER_PCT: "10"
          MOVER_ROLE_ID: ""
          # Insider open-market buys from SEC Form 4 (min $ value; XML fetches per cycle)
          INSIDER_BUYS: "1"
          INSIDER_MIN_USD: "50000"
          INSIDER_MAX_FETCH: "8"
          # Nasdaq Trader trading halts / resumptions
          HALTS: "1"
          # Daily recap after 16:15 ET on weekdays
          RECAP: "1"
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "update seen [skip ci]" && git pull --rebase && git push)
