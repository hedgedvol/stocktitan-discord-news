name: StockTitan news to Discord
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python stocktitan_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_SECONDS: "30"
          RUN_MINUTES: "340"
          # Filters (comma lists, empty = allow all). Example: TICKERS: "AAPL,TSLA"
          # KEYWORDS: headline must contain one; EXCLUDE: skip if headline contains one.
          TICKERS: ""
          KEYWORDS: ""
          EXCLUDE: ""
          # Optional SEC EDGAR filings, e.g. "8-K,4". Off by default (very noisy).
          SEC_FORMS: ""
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "update seen [skip ci]" && git pull --rebase && git push)
